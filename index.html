
<!DOCTYPE html>
<html>
<head>
    <title>JM Interior Design Studio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f0e8;
            color: #49372e;
        }

        header {
            background: #49372e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav button, button {
            background: #76533e;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        .container {
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        .home {
            text-align: center;
            padding: 60px 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>JM Interior Design Studio</h1>
    <nav>
        <button onclick="showHome()">Home</button>
        <button onclick="showRegister()">Register</button>
    </nav>
</header>

<div id="content">
    <div class="home">
        <h2>Design Your Dream Space</h2>
        <p>We create beautiful and modern interiors for your home.</p>
        <button onclick="showRegister()">Register Now</button>
    </div>
</div>

<footer>© 2026 JM Interior Design Studio</footer>

<script>
    function showHome() {
        document.getElementById("content").innerHTML = `
            <div class="home">
                <h2>Design Your Dream Space</h2>
                <p>We create beautiful and modern interiors for your home.</p>
                <button onclick="showRegister()">Register Now</button>
            </div>`;
    }

    function showRegister() {
        document.getElementById("content").innerHTML = `
            <div class="container">
                <h2>Client Registration</h2>
                <form onsubmit="register(event)">
                    <label>Full Name</label>
                    <input type="text" id="name" required>

                    <label>Email</label>
                    <input type="email" id="email" required>

                    <label>Password</label>
                    <input type="password" id="password" required>

                    <label>Age</label>
                    <input type="number" id="age" min="18" max="30" required>

                    <label>Mobile Number</label>
                    <input type="tel" id="mobile" required>

                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>

                    <label>State</label>
                    <select id="state" required>
                        <option value="">Select State</option>
                        <option>Tamil Nadu</option>
                        <option>Kerala</option>
                        <option>Karnataka</option>
                    </select>

                    <button type="submit">Submit Registration</button>
                    <p id="message"></p>
                </form>
            </div>`;
    }

    function register(event) {
        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        let age = Number(document.getElementById("age").value);
        let mobile = document.getElementById("mobile").value;

        let message = document.getElementById("message");

        if (!/^[A-Za-z ]+$/.test(name)) {
            message.innerHTML = "Enter a valid name.";
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            message.innerHTML = "Enter a valid email.";
        } else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(password)) {
            message.innerHTML = "Password needs 8 characters, uppercase, lowercase and a number.";
        } else if (age < 18 || age > 30) {
            message.innerHTML = "Age must be between 18 and 30.";
        } else if (!/^\d{10}$/.test(mobile)) {
            message.innerHTML = "Enter a 10-digit mobile number.";
        } else {
            message.innerHTML = "Registration successful!";
            message.style.color = "green";
        }
    }
</script>

</body>
</html>
